name: Publish site

# Builds index.html from content.md, profile.json, template.html and style.css,
# then publishes it with GitHub Pages. Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build website
        run: |
          node build.mjs
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
