name: Rebuild page

on:
  push:
    branches: [main]
    paths:
      - content.md
      - profile.json
      - template.html
      - style.css
      - build.mjs
      - .github/workflows/rebuild.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate static HTML
        run: node build.mjs
      - name: Save the updated page
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Rebuild page from editable content"
          git push origin HEAD:main
